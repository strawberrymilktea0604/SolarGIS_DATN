[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_grid_index"
version = "0.1.0"
description = "Shared Spatial R-Tree (STRtree) + KD-Tree Grid Index, Topological Snapping & Elastic Mass-Spring Regularization"
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
