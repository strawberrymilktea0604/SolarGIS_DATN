[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module2_uav_thermal_ai"
version = "0.1.0"
description = "Module 2: Dual-Stream RGB & Thermal AI (IEC TS 62446-3), DJI Thermal SDK dirp, Bidirectional Strip Homography & Hungarian Matching"
requires-python = ">=3.10"
dependencies = [
    "spatial_grid_index",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
]
